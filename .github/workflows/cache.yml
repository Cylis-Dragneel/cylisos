---
name: build-and-push-cache
"on":
  push:
    branches: ["main"]
    paths:
      - "npins/sources.json"
      - "default.nix"
      - "hosts/**"
      - "modules/**"
      - "programs/**"
      - "config/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build NixOS system closure
        run: |
          nix-build default.nix \
            -A nixosConfigurations.dragneel.config.system.build.toplevel
      - name: Build standalone Home Manager closure
        run: |
          nix-build default.nix \
            -A homeConfigurations.cylis.activationPackage
